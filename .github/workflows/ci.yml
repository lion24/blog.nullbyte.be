name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ci/tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma generate
          npx prisma db push

      - run: npm run lint

      - run: npx tsc --noEmit

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-key-for-ci
        run: npm test

  build:
    name: ci/build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate

      - name: Build application
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-time-secret
          GITHUB_CLIENT_ID: placeholder
          GITHUB_CLIENT_SECRET: placeholder
        run: npm run build

      - name: Verify build output
        run: test -d .next

  design:
    name: ci/design-detector
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned to the major version: picks up fixes without a new ruleset
      # landing mid-PR and silently failing an unrelated change.
      # https://impeccable.style/docs/detector/
      #
      # Findings are scored against .impeccable/config.json (committed) and
      # DESIGN.md. Exit codes: 0 = clean (advisories may remain), 1 = scan
      # failure (a target could not be read), 2 = primary findings. No
      # continue-on-error here: a non-zero exit fails this job, and the
      # later steps below still run (if: always()) to upload and comment.
      - name: Run Impeccable design detector
        id: detect
        run: npx impeccable@4 detect --json src > impeccable-findings.json

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-findings
          path: impeccable-findings.json

      # Only PRs have a diff to comment on; a push to main has nowhere to
      # post an inline comment.
      - name: Convert findings to rdjson
        if: always() && github.event_name == 'pull_request'
        run: node .github/scripts/impeccable-to-rdjson.mjs impeccable-findings.json > impeccable.rdjson.json

      - uses: reviewdog/action-setup@v1
        if: always() && github.event_name == 'pull_request'
        with:
          reviewdog_version: v0.17.0

      # reviewdog's default filter mode ("added") comments only on lines
      # that are part of this PR's diff, so a finding on code the PR didn't
      # touch lands in the uploaded JSON but not as a comment. -fail-level=none:
      # the `detect` step above already decides whether this job fails.
      - name: Comment findings inline on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: reviewdog -f=rdjson -name=impeccable -reporter=github-pr-review -fail-level=none < impeccable.rdjson.json
